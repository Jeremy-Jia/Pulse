plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.pulse.monitor'
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'dev.pulse.monitor'
        minSdk 26
        targetSdk 36
        versionCode 12
        versionName '1.9.1'
        testInstrumentationRunner 'dev.pulse.monitor.MonitorInstrumentation'
    }

    buildTypes {
        debug {
            debuggable true
            // Optional side-by-side build for appearance checks: -PpulseTestSuffix=.overlaytest
            if (project.hasProperty('pulseTestSuffix')) applicationIdSuffix project.property('pulseTestSuffix')
        }
        release {
            minifyEnabled false
            // Local test builds only. Replace this with a private release key before publishing.
            signingConfig signingConfigs.debug
        }
    }

    signingConfigs {
        debug {
            if (System.getenv('PULSE_SIGNING_STORE')) {
                storeFile file(System.getenv('PULSE_SIGNING_STORE'))
                storePassword System.getenv('PULSE_SIGNING_PASSWORD') ?: 'android'
                keyAlias System.getenv('PULSE_SIGNING_ALIAS') ?: 'androiddebugkey'
                keyPassword System.getenv('PULSE_SIGNING_PASSWORD') ?: 'android'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        buildConfig true
    }
    packaging {
        jniLibs {
            // PIE executables are packaged using the native-library installation path.
            useLegacyPackaging = true
            keepDebugSymbols += ['**/libpulsebench.so', '**/libcoremark.so', '**/libdhrystone.so', '**/libwhetstone.so', '**/libpulsecodec.so', '**/libmldsa_*.so', '**/libpulsememory.so']
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

def bundledPython = new File(System.getProperty('user.home'), '.cache/codex-runtimes/codex-primary-runtime/dependencies/python/python.exe')
def pythonCommand = System.getenv('PULSE_PYTHON') ?: (bundledPython.exists() ? bundledPython.absolutePath : 'python3')
def nativeOutputDir = file('src/main/jniLibs/arm64-v8a')
tasks.register('buildPulseBenchmarks', Exec) {
    description = 'Build pinned ARM64 benchmark sources and the read-only perf wrapper'
    group = 'build'
    inputs.files(fileTree('src/main/cpp'))
    inputs.property('ndkHome', System.getenv('PULSE_NDK_HOME') ?: 'default-r29')
    outputs.files(['libpulsebench.so', 'libcoremark.so', 'libdhrystone.so', 'libwhetstone.so', 'libpulsecodec.so', 'libmldsa_scalar.so', 'libmldsa_neon.so', 'libmldsa_sve.so', 'libmldsa_sve2.so', 'libpulsememory.so'].collect { new File(nativeOutputDir, it) })
    commandLine pythonCommand, file('src/main/cpp/build_native.py').absolutePath
}
tasks.named('preBuild').configure { dependsOn 'buildPulseBenchmarks' }
